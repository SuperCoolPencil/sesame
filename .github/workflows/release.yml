name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: sesame
            asset_name: sesame-linux-amd64
          - os: windows-latest
            artifact_name: sesame.exe
            asset_name: sesame-windows-amd64.exe
          - os: macos-latest
            artifact_name: sesame
            asset_name: sesame-macos-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --onefile --name sesame main.py


      - name: Rename artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: move dist\${{ matrix.artifact_name }} dist\${{ matrix.asset_name }}

      - name: Upload Renamed Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
